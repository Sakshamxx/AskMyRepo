# The corpus manifest: which repositories AskMyRepo reads, which of their files, and what it
# leaves out on purpose. Paths are relative to this file. Files are read from Git at each
# listed version, so virtual environments, caches and databases never get in.
#
# Patterns: * matches inside one folder, ** matches any number of folders.

[[repository]]
name = "shoplite"
path = "../shoplite"
# Two releases, newest first: answers should come from 2.0, but 1.1 is still in the corpus.
versions = [
    { ref = "main", version = "2.0" },
    { ref = "v1.1", version = "1.1" },
]
include = [
    "**/*.py",   # the application, the migrations (the schema's history) and scripts
    "**/*.md",   # README, CHANGELOG and the docs
    "**/*.sql",  # the reporting views
    "docs/**",   # anything else in the documentation folder
]
exclude = [
    "tests/**",           # answers should come from the code, not from tests about it
    "fixtures/**",        # synthetic seed data, not code
    "docs/openapi.json",  # generated by scripts/export_openapi.py: one minified line
]

[[repository]]
name = "shoplite-warehouse"
path = "../shoplite-warehouse"
versions = [{ ref = "main", version = "1.0" }]
include = ["**/*.py", "**/*.md"]
exclude = ["tests/**"]
